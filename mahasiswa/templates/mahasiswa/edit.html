{% extends 'mahasiswa/base.html' %}

{% block content %}

<h2>Edit Mahasiswa</h2>

<form method="post">
    {% csrf_token %}

    <p>
        NIM:
        <input type="text" name="nim" value="{{ mhs.nim }}">
    </p>

    <p>
        Nama:
        <input type="text" name="nama" value="{{ mhs.nama }}">
    </p>

    <p>
        Program Studi:
        <input type="text" name="programstudi" value="{{ mhs.programstudi }}">
    </p>

    <button type="submit">
        Update
    </button>

</form>

<br>

<a href="{% url 'daftar_mahasiswa' %}">
    Kembali
</a>

{% endblock %}
