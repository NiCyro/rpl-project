{% extends 'mahasiswa/base.html' %}

{% block content %}

<h2>Tambah Mahasiswa</h2>

<form method="post">
    {% csrf_token %}

    <p>
        NIM:
        <input type="text" name="nim">
    </p>

    <p>
        Nama:
        <input type="text" name="nama">
    </p>

    <p>
        Program Studi:
        <input type="text" name="programstudi">
    </p>

    <button type="submit">
        Simpan
    </button>

</form>

<br>

<a href="{% url 'daftar_mahasiswa' %}">
    Kembali
</a>

{% endblock %}
