{% extends 'mahasiswa/base.html' %}

{% block content %}

<div class="card">

    <h2>Daftar Mahasiswa</h2>

    <a href="{% url 'tambah_mahasiswa' %}" class="btn btn-tambah">
        + Tambah Mahasiswa
    </a>

    <table>
        <thead>
            <tr>
                <th>NIM</th>
                <th>Nama</th>
                <th>Program Studi</th>
                <th>Aksi</th>
            </tr>
        </thead>

        <tbody>
            {% for mhs in mahasiswas %}
            <tr>
                <td>{{ mhs.nim }}</td>
                <td>{{ mhs.nama }}</td>
                <td>{{ mhs.programstudi }}</td>
                <td>
                    <a href="{% url 'edit_mahasiswa' mhs.id %}" class="btn btn-edit">
                        Edit
                    </a>

                    <a href="{% url 'hapus_mahasiswa' mhs.id %}" class="btn btn-hapus">
                        Hapus
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
